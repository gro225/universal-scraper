name: harvester

services:
  postgres:
    # pgvector сразу — чтобы Фаза 1 (эмбеддинги) не требовала смены образа
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: harvester
      POSTGRES_PASSWORD: harvester
      POSTGRES_DB: harvester
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvester"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]   # 9001 — веб-консоль: смотреть Bronze глазами
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: harvester-dev-key
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    volumes: ["meilidata:/meili_data"]

  searxng:
    image: searxng/searxng:latest
    ports: ["8888:8080"]
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    volumes:
      - ./deploy/searxng:/etc/searxng:ro
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]

  api:
    build: .
    command: uvicorn harvester.api.main:app --host 0.0.0.0 --port 8080
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://harvester:harvester@postgres:5432/harvester
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      MEILI_URL: http://meilisearch:7700
      SEARXNG_URL: http://searxng:8080
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
      meilisearch: {condition: service_started}
    volumes:
      - ./tasks:/app/tasks:ro

volumes:
  pgdata:
  miniodata:
  meilidata:
